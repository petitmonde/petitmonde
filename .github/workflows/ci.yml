name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install root dependencies
        run: npm install

      - name: Check Prettier formatting
        run: npx prettier --check .

      - name: Install processing dependencies
        working-directory: ./processing
        run: uv sync --all-extras

      - name: Lint processing (Ruff)
        working-directory: ./processing
        run: uv run ruff check .

      - name: Check processing formatting (Ruff)
        working-directory: ./processing
        run: uv run ruff format --check .

      - name: Install backend dependencies
        working-directory: ./backend
        run: uv sync --all-extras

      - name: Lint backend (Ruff)
        working-directory: ./backend
        run: uv run ruff check .

      - name: Check backend formatting (Ruff)
        working-directory: ./backend
        run: uv run ruff format --check .

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Lint frontend (ESLint)
        working-directory: ./frontend
        run: npm run lint

  test-processing:
    name: Test Processing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        working-directory: ./processing
        run: uv sync --all-extras

      - name: Run tests
        working-directory: ./processing
        run: uv run pytest --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./processing/coverage.xml
          flags: processing

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --all-extras

      - name: Run tests
        working-directory: ./backend
        run: uv run pytest --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist
          retention-days: 7
