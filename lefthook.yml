commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    # Format all files with Prettier (non-Python)
    prettier:
      glob: "*.{js,ts,jsx,tsx,vue,json,md,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

    # Python: Processing
    ruff-check-processing:
      glob: "processing/**/*.py"
      root: "processing/"
      run: uv run ruff check --fix {files}
      stage_fixed: true
    ruff-format-processing:
      glob: "processing/**/*.py"
      root: "processing/"
      run: uv run ruff format {files}
      stage_fixed: true

    # Python: Backend
    ruff-check-backend:
      glob: "backend/**/*.py"
      root: "backend/"
      run: uv run ruff check --fix {files}
      stage_fixed: true
    ruff-format-backend:
      glob: "backend/**/*.py"
      root: "backend/"
      run: uv run ruff format {files}
      stage_fixed: true

    # Frontend: ESLint
    eslint:
      glob: "frontend/**/*.{js,ts,jsx,tsx,vue}"
      root: "frontend/"
      run: npm run lint -- --fix {files}
      stage_fixed: true
